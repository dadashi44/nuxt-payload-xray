name: Bug report
description: Wrong numbers, a crash, or a page that can't be analyzed
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page you ran the tool on. If it's private, attach the saved HTML instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: nuxt-payload-xray 0.1.1, Nuxt 4.2, Node 22
